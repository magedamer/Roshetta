<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roshetta | روشتة — Pharmacy Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
:root{
  --bg:#f3f7f6;--bg2:#e9f1ef;--card:#ffffff;--card2:#f8fbfa;--fg:#10302b;--muted:#5f7a75;--line:#dbe8e5;
  --p:#0f9d7a;--p2:#14c59a;--pd:#0a6f56;--acc:#6c5ce7;--warn:#f59e0b;--bad:#e5484d;--ok:#16a34a;--info:#0ea5e9;
  --r:18px;--sh:0 1px 2px rgba(16,48,43,.05),0 8px 28px rgba(16,48,43,.07);--sb:#0b2b26;--sbfg:#cfe5df;
  --font:'Tajawal','Inter',system-ui,sans-serif;
}
[data-theme=dark]{
  --bg:#0a1514;--bg2:#0f1d1b;--card:#12231f;--card2:#162a26;--fg:#e6f3f0;--muted:#8fb0a9;--line:#22403a;
  --sh:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35);--sb:#071a17;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--fg);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
[dir=ltr] body{font-family:'Inter','Tajawal',system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--p);outline-offset:2px}
.ic{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em}
/* layout */
#app{display:grid;grid-template-columns:260px 1fr;height:100vh}
aside{background:linear-gradient(180deg,var(--sb),#06201c);color:var(--sbfg);display:flex;flex-direction:column;padding:18px 14px;overflow:auto;position:relative;z-index:30}
.brand{display:flex;align-items:center;gap:12px;padding:6px 8px 20px}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--p2),var(--p));display:grid;place-items:center;color:#fff;box-shadow:0 6px 18px rgba(20,197,154,.4)}
.logo .ic{width:24px;height:24px}
.brand b{font-size:21px;color:#fff;letter-spacing:.2px;display:block;line-height:1.1}
.brand small{font-size:11.5px;opacity:.7}
nav{display:flex;flex-direction:column;gap:3px;flex:1}
nav a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;color:var(--sbfg);text-decoration:none;font-weight:500;transition:.18s;cursor:pointer}
nav a:hover{background:rgba(255,255,255,.07)}
nav a.on{background:linear-gradient(135deg,var(--p),var(--pd));color:#fff;box-shadow:0 6px 16px rgba(15,157,122,.35)}
nav a .badge{margin-inline-start:auto}
.sbfoot{margin-top:14px;padding:12px;border-radius:14px;background:rgba(255,255,255,.06);font-size:13px;display:flex;gap:10px;align-items:center}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--p));display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
main{display:flex;flex-direction:column;min-width:0;height:100vh}
header.top{display:flex;align-items:center;gap:12px;padding:14px 26px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header.top h1{font-size:22px;font-weight:800;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:42px;height:42px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;position:relative;transition:.15s;color:var(--fg)}
.iconbtn:hover{border-color:var(--p);color:var(--p)}
.iconbtn .dot{position:absolute;top:-5px;inset-inline-end:-5px;background:var(--bad);color:#fff;font-size:10.5px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;font-weight:700;padding:0 4px}
#view{flex:1;overflow:auto;padding:24px 26px 40px}
.menu-btn{display:none}
/* components */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:20px}
.card h3{font-size:16.5px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.kpi{display:flex;gap:14px;align-items:center;position:relative;overflow:hidden}
.kpi .k-ic{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;color:#fff;flex:none}
.kpi .k-ic .ic{width:24px;height:24px}
.kpi small{color:var(--muted);font-weight:500;display:block}
.kpi b{font-size:23px;font-weight:800;display:block;line-height:1.2}
.kpi::after{content:"";position:absolute;inset-inline-end:-30px;top:-30px;width:100px;height:100px;border-radius:50%;background:var(--kc,var(--p));opacity:.08}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:12px;font-weight:700;background:var(--card);border:1px solid var(--line);transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--p);color:var(--p)}
.btn.p{background:linear-gradient(135deg,var(--p),var(--pd));color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(15,157,122,.3)}
.btn.p:hover{filter:brightness(1.07);color:#fff}
.btn.d{background:var(--bad);color:#fff;border-color:transparent}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{width:100%;padding:10px 13px;border-radius:12px;border:1px solid var(--line);background:var(--card2);transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--p);box-shadow:0 0 0 3px color-mix(in srgb,var(--p) 18%,transparent);outline:0}
label.f{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:5px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.fg .full{grid-column:1/-1}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.bar .grow{flex:1;min-width:200px}
.sw{position:relative}
.sw .ic{position:absolute;inset-inline-start:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.sw input{padding-inline-start:40px}
table{width:100%;border-collapse:collapse}
.tw{overflow:auto;border-radius:14px;border:1px solid var(--line);background:var(--card)}
th{font-size:12.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;text-align:start;padding:12px 14px;background:var(--card2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--card2)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--bg2);color:var(--muted)}
.badge.ok{background:#16a34a22;color:var(--ok)}.badge.warn{background:#f59e0b22;color:#c77d05}.badge.bad{background:#e5484d22;color:var(--bad)}.badge.info{background:#0ea5e922;color:var(--info)}.badge.acc{background:#6c5ce722;color:var(--acc)}
[data-theme=dark] .badge.warn{color:#fbbf24}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:6px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:13.5px;transition:.15s}
.chip.on,.chip:hover{background:var(--p);color:#fff;border-color:var(--p)}
.muted{color:var(--muted)}.right{text-align:end}.b{font-weight:700}.nowrap{white-space:nowrap}
.row{display:flex;gap:10px;align-items:center}.sp{flex:1}
.empty{padding:40px;text-align:center;color:var(--muted)}
.list-i{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.list-i:last-child{border:0}
.pbar{height:8px;border-radius:9px;background:var(--bg2);overflow:hidden;flex:1}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--p2));border-radius:9px}
/* POS */
.pos{display:grid;grid-template-columns:1fr 410px;gap:18px;height:calc(100vh - 140px);min-height:560px}
.pos .left{display:flex;flex-direction:column;min-height:0}
.pgrid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px;align-content:start;padding:2px 2px 8px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:start;transition:.15s;display:flex;flex-direction:column;gap:6px;position:relative}
.pc:hover{border-color:var(--p);transform:translateY(-2px);box-shadow:var(--sh)}
.pc .pill{width:38px;height:38px;border-radius:11px;background:color-mix(in srgb,var(--c,var(--p)) 16%,transparent);color:var(--c,var(--p));display:grid;place-items:center}
.pc b{font-size:14.5px;line-height:1.3}
.pc .pr{font-weight:800;color:var(--pd);font-size:16px}
[data-theme=dark] .pc .pr{color:var(--p2)}
.pc.out{opacity:.5}
.cart{display:flex;flex-direction:column;min-height:0;padding:16px}
.cart .lines{flex:1;overflow:auto;margin:8px -6px;padding:0 6px}
.cl{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.qty button{width:30px;height:30px;display:grid;place-items:center;background:var(--card2)}
.qty button:hover{background:var(--p);color:#fff}
.qty input{width:44px;text-align:center;border:0;border-radius:0;padding:4px;background:transparent}
.tot{display:grid;gap:5px;padding-top:10px;border-top:2px solid var(--line)}
.tot div{display:flex;justify-content:space-between}
.tot .g{font-size:22px;font-weight:800;color:var(--pd)}
[data-theme=dark] .tot .g{color:var(--p2)}
.pays{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.pays button{padding:8px 4px;border-radius:10px;border:1px solid var(--line);background:var(--card2);font-size:13px;font-weight:700}
.pays button.on{background:var(--p);color:#fff;border-color:var(--p)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(5,20,17,.55);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:100;padding:16px;animation:fade .15s}
.md{background:var(--card);border-radius:22px;width:min(640px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:pop .2s}
.md.w{width:min(980px,100%)}
.md header{display:flex;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
.md header h2{font-size:19px;flex:1}
.md .bd{padding:22px;overflow:auto}
.md footer{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
@keyframes fade{from{opacity:0}}@keyframes pop{from{transform:scale(.96) translateY(8px);opacity:0}}
#toasts{position:fixed;bottom:22px;inset-inline-start:50%;transform:translateX(-50%);display:grid;gap:8px;z-index:200}
[dir=rtl] #toasts{transform:translateX(50%)}
.toast{background:var(--fg);color:var(--bg);padding:11px 20px;border-radius:13px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:pop .2s;max-width:90vw}
.toast.bad{background:var(--bad);color:#fff}.toast.warn{background:var(--warn);color:#2b1c00}
/* login */
#login{position:fixed;inset:0;z-index:300;display:grid;place-items:center;background:radial-gradient(1200px 600px at 20% 10%,#14c59a55,transparent),radial-gradient(900px 600px at 90% 90%,#6c5ce744,transparent),#06201c;padding:16px}
.lg{width:min(420px,100%);background:var(--card);border-radius:26px;padding:34px;box-shadow:0 40px 100px rgba(0,0,0,.5)}
.lg .logo{width:62px;height:62px;border-radius:19px;margin:0 auto 12px}.lg .logo .ic{width:34px;height:34px}
.lg h1{text-align:center;font-size:30px;font-weight:800}.lg p{text-align:center;color:var(--muted);margin-bottom:22px}
/* receipt */
.rc{font-family:'Courier New',monospace;font-size:13px;max-width:320px;margin:auto;color:#000;background:#fff;padding:14px}
.rc h4{text-align:center;font-size:17px}.rc hr{border:0;border-top:1px dashed #000;margin:8px 0}
.rc table td,.rc table th{padding:2px 0;border:0;background:none;color:#000;font-size:13px;text-transform:none;letter-spacing:0}
#printarea{display:none}
@media print{body>*:not(#printarea){display:none!important}#printarea{display:block!important}}
.bars{display:flex;align-items:flex-end;gap:10px;height:200px;padding-top:10px}
.bars .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars .c i{width:100%;max-width:46px;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,var(--p2),var(--p));min-height:3px;transition:.4s}
.bars .c span{font-size:12px;color:var(--muted)}.bars .c em{font-style:normal;font-size:11.5px;font-weight:700}
.donut{--s:150px;width:var(--s);height:var(--s);border-radius:50%;display:grid;place-items:center;flex:none}
.donut::after{content:attr(data-c);width:calc(var(--s) - 44px);height:calc(var(--s) - 44px);border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:800;text-align:center;font-size:13px}
.dot2{width:10px;height:10px;border-radius:50%;display:inline-block;margin-inline-end:6px}
@media(max-width:1100px){.pos{grid-template-columns:1fr;height:auto}.pgrid{max-height:420px}}
@media(max-width:860px){
  #app{grid-template-columns:1fr}
  aside{position:fixed;inset-block:0;inset-inline-start:0;width:270px;transform:translateX(100%);transition:.25s}
  [dir=ltr] aside{transform:translateX(-100%)}
  aside.open{transform:none!important}
  .menu-btn{display:grid}
  #view{padding:16px 14px 40px}header.top{padding:12px 14px}
}
</style>
</head>
<body>
<div id="login"></div>
<div id="app" hidden>
  <aside id="sb"></aside>
  <main>
    <header class="top">
      <button class="iconbtn menu-btn" onclick="$('#sb').classList.toggle('open')" aria-label="menu"></button>
      <h1 id="ttl"></h1>
      <div class="row" id="topact"></div>
    </header>
    <div id="view"></div>
  </main>
</div>
<div id="toasts"></div>
<div id="printarea"></div>

<script>
/* ====================== Roshetta | روشتة ====================== */
const $=(s,e=document)=>e.querySelector(s), $$=(s,e=document)=>[...e.querySelectorAll(s)];
const KEY='roshetta_v1';
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const addDays=(n,d=new Date())=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const today=()=>ymd(new Date());
const daysTo=s=>Math.ceil((new Date(s+'T00:00:00')-new Date(today()+'T00:00:00'))/864e5);
let mem=null;
const store={get(){try{return localStorage.getItem(KEY)}catch(e){return mem}},set(v){try{localStorage.setItem(KEY,v)}catch(e){mem=v}}};

/* ---------- icons ---------- */
const IC={
home:'<path d="M3 11l9-8 9 8"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-6h4v6"/>',
cart:'<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l3 12h11l2-8H6"/>',
pill:'<path d="M10.5 20.5a5 5 0 0 1-7-7l10-10a5 5 0 0 1 7 7z"/><path d="M8.5 8.5l7 7"/>',
box:'<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
truck:'<path d="M1 6h13v10H1zM14 10h4l3 3v3h-7"/><circle cx="6" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',
users:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-4 3-6 7-6s7 2 7 6M17 4.5a3.5 3.5 0 0 1 0 7M22 20c0-3-2-5-4.5-5.5"/>',
file:'<path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6M9 13h6M9 17h6"/>',
wallet:'<path d="M3 7h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 7l2-3h12M16 14h2"/>',
chart:'<path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/>',
clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
cog:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',
shield:'<path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z"/><path d="M9 12l2 2 4-4"/>',
bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 0 0 4 0"/>',
search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
plus:'<path d="M12 5v14M5 12h14"/>',minus:'<path d="M5 12h14"/>',
trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 10v6M14 10v6"/>',
edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/>',
print:'<path d="M6 9V3h12v6M6 18H4v-8h16v8h-2"/><path d="M6 14h12v7H6z"/>',
x:'<path d="M6 6l12 12M18 6L6 18"/>',
moon:'<path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/>',
sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/>',
globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.500 0 18M12 3c-3 3.500-3 14.500 0 18"/>',
down:'<path d="M12 3v12M7 10l5 5 5-5M4 20h16"/>',up:'<path d="M12 15V3M7 8l5-5 5 5M4 20h16"/>',
barcode:'<path d="M4 5v14M7 5v14M11 5v14M14 5v10M17 5v14M20 5v14"/>',
pause:'<path d="M8 5v14M16 5v14"/>',play:'<path d="M7 4l13 8-13 8z"/>',
undo:'<path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/>',
alert:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/>',
tag:'<path d="M3 12V3h9l9 9-9 9z"/><circle cx="8" cy="8" r="1.5"/>',
logout:'<path d="M10 4H4v16h6M14 8l5 4-5 4M19 12H9"/>',
menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',
check:'<path d="M5 12l5 5 9-10"/>',
heart:'<path d="M12 21s-8-5-8-11a4.500 4.500 0 0 1 8-2.500A4.500 4.500 0 0 1 20 10c0 6-8 11-8 11z"/>',
swap:'<path d="M4 8h14l-3-3M20 16H6l3 3"/>',
bag:'<path d="M5 8h14l1 13H4z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>'
};
const ic=(n,c='')=>`<svg class="ic ${c}" viewBox="0 0 24 24" aria-hidden="true">${IC[n]||''}</svg>`;

/* ---------- state ---------- */
let DB=null, ME=null, VIEW='dashboard', cart=[], cartOpts={disc:0,discType:'%',pay:'cash',cust:'',recv:''}, held=[], filt={};
const CATS=[['Analgesic','مسكنات'],['Antibiotic','مضادات حيوية'],['Cardio','قلب وضغط'],['Diabetes','سكر'],['GI','جهاز هضمي'],['Respiratory','صدر وتنفس'],['Allergy','حساسية'],['Vitamins','فيتامينات'],['Topical','موضعي'],['Cold & Flu','برد وإنفلونزا'],['Cosmetics','مستحضرات تجميل'],['Baby','أطفال'],['Other','أخرى']];
const CCOL=['#0f9d7a','#6c5ce7','#0ea5e9','#f59e0b','#e5484d','#14b8a6','#ec4899','#84cc16','#f97316','#06b6d4','#a855f7','#22c55e','#64748b'];

/* ---------- stock helpers ---------- */
const stockAll=m=>m.batches.reduce((a,b)=>a+b.qty,0);
const stockOk=m=>m.batches.filter(b=>daysTo(b.exp)>=0).reduce((a,b)=>a+b.qty,0);
const stockExpired=m=>m.batches.filter(b=>daysTo(b.exp)<0).reduce((a,b)=>a+b.qty,0);
const nearExp=m=>m.batches.filter(b=>b.qty>0&&daysTo(b.exp)>=0&&daysTo(b.exp)<=DB.settings.expDays);
const expiredB=m=>m.batches.filter(b=>b.qty>0&&daysTo(b.exp)<0);
const isLow=m=>stockOk(m)<=m.min;
const medById=id=>DB.meds.find(m=>m.id===id);
const custById=id=>DB.customers.find(c=>c.id===id);
const supById=id=>DB.suppliers.find(c=>c.id===id);
const userById=id=>DB.users.find(c=>c.id===id);
const saleNet=s=>s.total-(s.ret?.amount||0);
const saleCost=s=>s.items.reduce((a,i)=>a+i.qty*i.cost,0)-(s.ret?.cost||0);
function alerts(){
  const low=DB.meds.filter(isLow),near=DB.meds.filter(m=>nearExp(m).length),exp=DB.meds.filter(m=>expiredB(m).length);
  const refills=DB.rx.filter(r=>r.status!=='done'&&r.refill&&daysTo(r.refill)<=3);
  return {low,near,exp,refills,count:low.length+near.length+exp.length+refills.length};
}
const INTER=[['warfarin','aspirin'],['warfarin','ibuprofen'],['warfarin','diclofenac'],['aspirin','ibuprofen'],['metformin','ciprofloxacin'],['azithromycin','warfarin'],['ciprofloxacin','glimepiride'],['atorvastatin','azithromycin'],['bisoprolol','insulin']];
function interactions(ids){
  const g=ids.map(i=>(medById(i)?.generic||'').toLowerCase());const out=[];
  INTER.forEach(([a,b])=>{if(g.some(x=>x.includes(a))&&g.some(x=>x.includes(b)))out.push(a+' + '+b)});
  return out;
}

/* ---------- ui helpers ---------- */
function toast(msg,type=''){const e=document.createElement('div');e.className='toast '+type;e.textContent=msg;$('#toasts').appendChild(e);setTimeout(()=>e.remove(),type?4200:2600)}
function modal(title,body,o={}){
  const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<div class="md ${o.wide?'w':''}" role="dialog" aria-modal="true"><header><h2>${title}</h2><button class="iconbtn" data-x aria-label="close">${ic('x')}</button></header><div class="bd">${body}</div>${o.noFoot?'':`<footer><button class="btn" data-x>${t('Cancel','إلغاء')}</button>${o.extra||''}<button class="btn p" data-ok>${o.ok||t('Save','حفظ')}</button></footer>`}</div>`;
  const close=()=>ov.remove();
  ov.addEventListener('click',e=>{if(e.target===ov||e.target.closest('[data-x]'))close()});
  ov.querySelector('[data-ok]')?.addEventListener('click',()=>{if(o.onOk&&o.onOk(ov)===false)return;close()});
  document.body.appendChild(ov);
  setTimeout(()=>ov.querySelector('input:not([type=hidden]),select')?.focus(),30);
  ov.close=close;return ov;
}
const fv=(ov,n)=>ov.querySelector(`[name=${n}]`)?.value;
const field=(label,name,val='',type='text',extra='')=>`<div><label class="f">${label}</label><input name="${name}" type="${type}" value="${esc(val)}" ${extra}></div>`;
const sel=(label,name,opts,val='')=>`<div><label class="f">${label}</label><select name="${name}">${opts.map(o=>`<option value="${esc(o[0])}" ${o[0]==val?'selected':''}>${esc(o[1])}</option>`).join('')}</select></div>`;
const confirmD=(msg,fn)=>modal(t('Confirm','تأكيد'),`<p>${msg}</p>`,{ok:t('Yes','نعم'),onOk:()=>fn()});
function csv(name,rows){const b=new Blob(['﻿'+rows.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name+'.csv';a.click()}
const tableWrap=(h,rows,empty)=>rows.length?`<div class="tw"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`:`<div class="card empty">${ic('box')}<p>${empty||t('No data','لا توجد بيانات')}</p></div>`;
function kpi(icn,label,val,col,sub=''){return `<div class="card kpi" style="--kc:${col}"><div class="k-ic" style="background:linear-gradient(135deg,${col},${col}cc)">${ic(icn)}</div><div><small>${label}</small><b>${val}</b>${sub?`<small>${sub}</small>`:''}</div></div>`}
function barChart(vals,labels){const mx=Math.max(...vals,1);return `<div class="bars">${vals.map((v,i)=>`<div class="c"><em>${v?num(Math.round(v)):''}</em><i style="height:${Math.max(2,v/mx*78)}%"></i><span>${labels[i]}</span></div>`).join('')}</div>`}
function donut(parts){const tot=parts.reduce((a,p)=>a+p.v,0)||1;let acc=0;const segs=parts.map(p=>{const s=acc/tot*100;acc+=p.v;return `${p.c} ${s}% ${acc/tot*100}%`}).join(',');
  return `<div class="row" style="gap:22px;flex-wrap:wrap"><div class="donut" style="background:conic-gradient(${segs||'var(--bg2) 0 100%'})" data-c="${money(tot).replace(/\.00/,'')}"></div><div style="flex:1;min-width:140px">${parts.map(p=>`<div class="list-i" style="padding:5px 0"><span><i class="dot2" style="background:${p.c}"></i>${p.l}</span><span class="sp"></span><b>${Math.round(p.v/tot*100)}%</b></div>`).join('')}</div></div>`}

    const f=DB.meds.filter(m=>[m.en,m.ar,m.generic].some(x=>(x||'').toLowerCase().includes(q.toLowerCase())));if(f.length===1){addCart(f[0].id);pq.value='';filt.pq='';drawGrid()}else if(!f.length)toast(t('Not found','غير موجود'),'bad')}};

function addCart(id,qty=1){
  const m=medById(id);if(!m)return;const l=cart.find(c=>c.id===id);const have=l?l.qty:0;
  if(have+qty>stockOk(m)){toast(t('Insufficient stock','الكمية المتاحة غير كافية')+` (${stockOk(m)})`,'bad');return}
  if(l)l.qty+=qty;else cart.push({id,qty,price:m.price});
  if(m.rx&&!l)toast(t('Prescription-only medicine (Rx)','دواء بروشتة طبية (Rx)'),'warn');
  const w=interactions(cart.map(c=>c.id));if(w.length&&!l)toast(t('⚠ Possible interaction: ','⚠ تداخل دوائي محتمل: ')+w.join(' | '),'warn');
  if(VIEW==='pos')drawCart();
}
function cartTotals(){
  const sub=cart.reduce((a,c)=>a+c.qty*c.price,0);
  let d=cartOpts.discType==='%'?sub*(+cartOpts.disc||0)/100:(+cartOpts.disc||0);d=Math.min(Math.max(d,0),sub);
  const tax=(sub-d)*(+DB.settings.tax||0)/100;return {sub,disc:d,tax,total:sub-d+tax};
}
function drawCart(){
  const box=$('#cartbox');if(!box)return;const T=cartTotals();
  box.innerHTML=`<div class="row"><h3 style="margin:0" class="sp">${ic('cart')} ${t('Current invoice','الفاتورة الحالية')}</h3>
    <button class="btn sm" onclick="holdCart()" title="${t('Hold','تعليق')}">${ic('pause')}</button>
    <button class="btn sm" onclick="resumeCart()" title="${t('Held invoices','الفواتير المعلقة')}">${ic('play')}${held.length?` ${held.length}`:''}</button>
    <button class="btn sm" onclick="cart=[];drawCart()" title="${t('Clear','مسح')}">${ic('trash')}</button></div>
  <div class="lines">${cart.length?cart.map((c,i)=>{const m=medById(c.id);return `<div class="cl"><div><b>${esc(mname(m))}</b><div class="muted" style="font-size:12.5px">${money(c.price)}</div></div><b class="right">${money(c.qty*c.price)}</b>
    <div class="qty"><button onclick="cq(${i},-1)">${ic('minus')}</button><input type="number" min="1" value="${c.qty}" onchange="cqs(${i},this.value)"><button onclick="cq(${i},1)">${ic('plus')}</button></div>
    <button class="btn sm right" style="justify-self:end" onclick="cart.splice(${i},1);drawCart()">${ic('x')}</button></div>`}).join(''):`<div class="empty">${ic('cart')}<p>${t('Cart is empty — tap a medicine to add','السلة فارغة — اضغط على دواء لإضافته')}</p></div>`}</div>
  <div class="fg" style="grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px">
    <div><label class="f">${t('Customer','العميل')}</label><select id="cc" onchange="cartOpts.cust=this.value"><option value="">${t('Walk-in','عميل نقدي')}</option>${DB.customers.map(c=>`<option value="${c.id}" ${cartOpts.cust===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
    <div><label class="f">${t('Discount','خصم')}</label><div class="row" style="gap:4px"><input type="number" min="0" value="${cartOpts.disc||''}" oninput="cartOpts.disc=this.value;drawTot()" style="min-width:0"><select style="width:62px;padding:10px 4px" onchange="cartOpts.discType=this.value;drawTot()"><option ${cartOpts.discType==='%'?'selected':''}>%</option><option ${cartOpts.discType!=='%'?'selected':''} value="$">${DB.settings.currency}</option></select></div></div></div>
  <div class="pays">${[['cash',t('Cash','نقدي')],['card',t('Card','بطاقة')],['wallet',t('Wallet','محفظة')],['credit',t('Credit','آجل')]].map(p=>`<button class="${cartOpts.pay===p[0]?'on':''}" onclick="cartOpts.pay='${p[0]}';drawCart()">${p[1]}</button>`).join('')}</div>
  <div class="tot" id="tot"></div>
  <button class="btn p" style="margin-top:12px;padding:14px;font-size:17px" onclick="checkout()" ${cart.length?'':'disabled'}>${ic('check')} ${t('Pay & print (F9)','دفع وطباعة (F9)')}</button>`;
  drawTot();
}
function drawTot(){
  const T=cartTotals();const tt=$('#tot');if(!tt)return;
  tt.innerHTML=`<div><span class="muted">${t('Subtotal','المجموع')}</span><span>${money(T.sub)}</span></div>${T.disc?`<div><span class="muted">${t('Discount','الخصم')}</span><span>- ${money(T.disc)}</span></div>`:''}${T.tax?`<div><span class="muted">${t('Tax','ضريبة')} ${DB.settings.tax}%</span><span>${money(T.tax)}</span></div>`:''}<div class="g"><span>${t('Total','الإجمالي')}</span><span>${money(T.total)}</span></div>
  ${cartOpts.pay==='cash'?`<div class="row" style="margin-top:4px"><input type="number" placeholder="${t('Cash received','المبلغ المستلم')}" value="${cartOpts.recv}" oninput="cartOpts.recv=this.value;const r=+this.value-cartTotals().total;$('#chg').textContent=r>=0?money(r):'—'"><b class="nowrap">${t('Change','الباقي')}: <span id="chg">${cartOpts.recv&&+cartOpts.recv>=T.total?money(+cartOpts.recv-T.total):'—'}</span></b></div>`:''}`;
}
function cq(i,d){const c=cart[i];cqs(i,c.qty+d)}
function cqs(i,v){v=Math.floor(+v);const c=cart[i];if(v<1){cart.splice(i,1);drawCart();return}const m=medById(c.id);if(v>stockOk(m)){toast(t('Insufficient stock','الكمية غير كافية')+` (${stockOk(m)})`,'bad');v=stockOk(m)}c.qty=v;drawCart()}
function holdCart(){if(!cart.length)return;held.push({cart,cartOpts:{...cartOpts},t:Date.now()});cart=[];cartOpts={disc:0,discType:'%',pay:'cash',cust:'',recv:''};toast(t('Invoice held','تم تعليق الفاتورة'));drawCart()}
function resumeCart(){
  if(!held.length){toast(t('No held invoices','لا توجد فواتير معلقة'));return}
  const ov=modal(t('Held invoices','الفواتير المعلقة'),held.map((h,i)=>`<div class="list-i"><div class="sp"><b>#${i+1}</b> — ${h.cart.length} ${t('items','أصناف')}<div class="muted">${new Date(h.t).toLocaleTimeString()}</div></div><button class="btn sm p" data-r="${i}">${t('Resume','استئناف')}</button></div>`).join(''),{noFoot:true});
  $$('[data-r]',ov).forEach(b=>b.onclick=()=>{const h=held.splice(+b.dataset.r,1)[0];if(cart.length)held.push({cart,cartOpts:{...cartOpts},t:Date.now()});cart=h.cart;cartOpts=h.cartOpts;ov.close();drawCart()});
}
function checkout(){
  if(!cart.length)return;const T=cartTotals();
  if(cartOpts.pay==='credit'&&!cartOpts.cust){toast(t('Choose a customer for credit sales','اختر عميلاً للبيع الآجل'),'bad');return}
  for(const c of cart){const m=medById(c.id);if(c.qty>stockOk(m)){toast(t('Insufficient stock: ','مخزون غير كافٍ: ')+mname(m),'bad');return}}
  const items=[];
  cart.forEach(c=>{const m=medById(c.id);let need=c.qty;
    m.batches.filter(b=>b.qty>0&&daysTo(b.exp)>=0).sort((a,b)=>a.exp.localeCompare(b.exp)).forEach(b=>{if(need<=0)return;const u=Math.min(b.qty,need);b.qty-=u;need-=u;items.push({medId:m.id,name:m.en,ar:m.ar,qty:u,price:c.price,cost:m.cost,batch:b.batch})});});
  const sale={id:uid(),no:'INV-'+(DB.seq.sale++),date:new Date().toISOString(),items,sub:T.sub,disc:T.disc,tax:T.tax,total:T.total,pay:cartOpts.pay,cust:cartOpts.cust,user:ME.id,ret:{amount:0,cost:0}};
  DB.sales.push(sale);
  if(sale.cust){const c=custById(sale.cust);c.points=(c.points||0)+Math.floor(T.total/10);if(sale.pay==='credit')c.debt=(c.debt||0)+T.total}
  persist();cart=[];cartOpts={disc:0,discType:'%',pay:'cash',cust:'',recv:''};
  showReceipt(sale);render();
}

  <div>${s.no} · ${dt(s.date)}</div><div>${t('Cashier','الكاشير')}: ${esc(userById(s.user)?.name||'')}</div>${c?`<div>${t('Customer','العميل')}: ${esc(c.name)}</div>`:''}<hr>

  <div style="text-align:center">${t('Payment','الدفع')}: ${({cash:t('Cash','نقدي'),card:t('Card','بطاقة'),wallet:t('Wallet','محفظة'),credit:t('Credit','آجل')})[s.pay]}<br>${esc(DB.settings.footer)}</div></div>`;

function returnForm(id){
  const s=DB.sales.find(x=>x.id===id);
  // group by med
  const g={};s.items.forEach(i=>{g[i.medId]=g[i.medId]||{...i,qty:0};g[i.medId].qty+=i.qty});const ret=s.retQty||{};
  modal(t('Return from ','مرتجع من ')+s.no,`<div class="tw"><table><thead><tr><th>${t('Item','الصنف')}</th><th>${t('Sold','المباع')}</th><th>${t('Returned','سبق إرجاعه')}</th><th>${t('Return now','إرجاع الآن')}</th></tr></thead><tbody>${Object.values(g).map(i=>{const r=ret[i.medId]||0;return `<tr><td>${esc(L()==='ar'?i.ar:i.name)}</td><td>${i.qty}</td><td>${r}</td><td><input type="number" min="0" max="${i.qty-r}" value="0" data-m="${i.medId}" style="width:80px;padding:6px"></td></tr>`}).join('')}</tbody></table></div>`,{ok:t('Confirm return','تأكيد المرتجع'),onOk:ov=>{
    let amt=0,cost=0,any=false;s.retQty=s.retQty||{};
    $$('[data-m]',ov).forEach(i=>{const q=Math.min(+i.value||0,+i.max);if(q>0){any=true;const m=medById(i.dataset.m);const it=s.items.find(x=>x.medId===i.dataset.m);amt+=q*it.price*(1-(s.disc/s.sub||0));cost+=q*it.cost;s.retQty[i.dataset.m]=(s.retQty[i.dataset.m]||0)+q;
      if(m){const b=m.batches.find(b=>b.batch===(it.batch))||m.batches[0];if(b)b.qty+=q;else m.batches.push({batch:'RET',exp:ymd(addDays(365)),qty:q})}}});
    if(!any){toast(t('Enter quantities','أدخل الكميات'),'bad');return false}
    s.ret.amount+=amt;s.ret.cost+=cost;if(s.cust&&s.pay==='credit'){const c=custById(s.cust);c.debt=Math.max(0,c.debt-amt)}
    persist();render();toast(t('Return recorded: ','تم المرتجع: ')+money(amt))}});
}

      DB.purchases.push({id:uid(),no:'PO-'+(DB.seq.po++),date:new Date().toISOString(),supplier:fv(o,'sup'),items:rows.map(r=>({medId:r.medId,en:medById(r.medId).en,qty:+r.qty,cost:+r.cost,batch:r.batch,exp:r.exp})),total,paid});
      supById(fv(o,'sup')).balance+=total-paid;persist();render();toast(t('Purchase saved — stock updated','تم الحفظ وتحديث المخزون'))}});
  const draw=()=>{$('#prows',ov).innerHTML=rows.length?`<div class="tw"><table><thead><tr><th>${t('Item','الصنف')}</th><th>${t('Qty','الكمية')}</th><th>${t('Cost','التكلفة')}</th><th>${t('Batch','التشغيلة')}</th><th>${t('Expiry','الانتهاء')}</th><th></th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td><b>${esc(mname(medById(r.medId)))}</b></td><td><input type="number" min="1" value="${r.qty}" style="width:80px;padding:6px" data-f="qty" data-i="${i}"></td><td><input type="number" min="0" step="0.01" value="${r.cost}" style="width:90px;padding:6px" data-f="cost" data-i="${i}"></td><td><input value="${esc(r.batch)}" style="width:100px;padding:6px" data-f="batch" data-i="${i}"></td><td><input type="date" value="${r.exp}" style="padding:6px" data-f="exp" data-i="${i}"></td><td><button class="btn sm" data-d="${i}">${ic('x')}</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">${t('No items yet','لم تتم إضافة أصناف')}</div>`;
    $$('[data-f]',ov).forEach(i=>i.onchange=()=>{rows[+i.dataset.i][i.dataset.f]=i.type==='number'?+i.value:i.value;tot()});$$('[data-d]',ov).forEach(b=>b.onclick=()=>{rows.splice(+b.dataset.d,1);draw()});tot()};
  const tot=()=>{$('#ptot',ov).textContent=t('Total: ','الإجمالي: ')+money(rows.reduce((a,r)=>a+r.qty*r.cost,0))};
  $('#ps',ov).onchange=e=>{const bc=e.target.value.split('|').pop().trim();const m=DB.meds.find(x=>x.barcode===bc)||DB.meds.find(x=>x.barcode===e.target.value.trim());if(m){rows.push({medId:m.id,qty:1,cost:m.cost,batch:'',exp:ymd(addDays(540))});e.target.value='';draw()}};

    if(!fv(o,'patient').trim()||!items.length){toast(t('Patient and medicines required','المريض والأدوية مطلوبة'),'bad');return false}
    DB.rx.push({id:uid(),no:'RX-'+(DB.seq.rx++),date:today(),patient:fv(o,'patient'),phone:fv(o,'phone'),doctor:fv(o,'doctor'),notes:fv(o,'notes'),refill:fv(o,'refill'),items,status:'pending'});persist();render()}});
  const draw=()=>{const w=interactions(items.map(i=>i.medId));$('#rit',ov).innerHTML=(w.length?`<div class="badge bad" style="margin-bottom:8px">⚠ ${t('Interaction','تداخل دوائي')}: ${w.join(' | ')}</div>`:'')+items.map((it,i)=>`<div class="list-i"><b class="sp">${esc(mname(medById(it.medId)))}</b><input type="number" min="1" value="${it.qty}" style="width:70px;padding:6px" data-q="${i}"><input placeholder="${t('Dose','الجرعة')}" value="${esc(it.dose)}" style="width:160px;padding:6px" data-dose="${i}"><button class="btn sm" data-d="${i}">${ic('x')}</button></div>`).join('');
    $$('[data-q]',ov).forEach(x=>x.onchange=()=>items[+x.dataset.q].qty=+x.value);$$('[data-dose]',ov).forEach(x=>x.onchange=()=>items[+x.dataset.dose].dose=x.value);$$('[data-d]',ov).forEach(x=>x.onclick=()=>{items.splice(+x.dataset.d,1);draw()})};
  $('#rs',ov).onchange=e=>{const bc=e.target.value.split('|').pop().trim();const m=DB.meds.find(x=>x.barcode===bc);if(m){items.push({medId:m.id,qty:1,dose:''});e.target.value='';draw()}};draw();
}
function dispenseRx(id){
  const r=DB.rx.find(x=>x.id===id);cart=[];let miss=[];r.items.forEach(i=>{const m=medById(i.medId);if(m&&stockOk(m)>=i.qty)cart.push({id:i.medId,qty:i.qty,price:m.price});else miss.push(m?mname(m):'?')});
  r.status='done';if(r.refill&&daysTo(r.refill)<=0)r.refill=ymd(addDays(30));persist();
  if(miss.length)toast(t('Out of stock: ','غير متوفر: ')+miss.join(', '),'warn');
  const c=DB.customers.find(x=>x.phone&&x.phone===r.phone);if(c)cartOpts.cust=c.id;
  go('pos');
}

/* ---- Expenses ---- */
V.expenses=el=>{
  const list=DB.expenses.filter(e=>e.cat!=='_income').slice().reverse();const tot=list.reduce((a,e)=>a+e.amount,0);
  el.innerHTML=`<div class="bar"><div class="card" style="padding:10px 16px"><span class="muted">${t('Total expenses','إجمالي المصروفات')}:</span> <b>${money(tot)}</b></div><span class="sp"></span><button class="btn p" onclick="expForm()">${ic('plus')} ${t('Add expense','إضافة مصروف')}</button></div>`+
  tableWrap([t('Date','التاريخ'),t('Category','البند'),t('Amount','المبلغ'),t('Note','ملاحظة'),''],list.map(e=>`<tr><td>${dd(e.date)}</td><td><span class="badge">${esc(e.cat)}</span></td><td><b>${money(e.amount)}</b></td><td>${esc(e.note||'')}</td><td><button class="btn sm" onclick="DB.expenses=DB.expenses.filter(x=>x.id!=='${e.id}');persist();render()">${ic('trash')}</button></td></tr>`));
};
function expForm(){modal(t('New expense','مصروف جديد'),`<div class="fg">${sel(t('Category','البند'),'cat',['Rent','Salaries','Electricity','Water','Internet','Supplies','Maintenance','Other'].map(x=>[x,x]))}${field(t('Amount','المبلغ'),'amount','','number','min="0" step="0.01"')}${field(t('Date','التاريخ'),'date',today(),'date')}${field(t('Note','ملاحظة'),'note')}</div>`,{onOk:o=>{const a=+fv(o,'amount');if(!(a>0)){toast(t('Enter amount','أدخل المبلغ'),'bad');return false}DB.expenses.push({id:uid(),date:fv(o,'date'),cat:fv(o,'cat'),amount:a,note:fv(o,'note')});persist();render()}})}

/* ---- Reports ---- */
V.reports=el=>{
  filt.rf=filt.rf||ymd(addDays(-29));filt.rt=filt.rt||today();
  el.innerHTML=`<div class="bar">${field(t('From','من'),'rf',filt.rf,'date')}${field(t('To','إلى'),'rt',filt.rt,'date')}<span class="sp"></span><button class="btn" id="rexp">${ic('down')} CSV</button></div><div id="rbody"></div>`;
  const draw=()=>{
    const f=filt.rf,to=filt.rt;const S=DB.sales.filter(s=>ymd(s.date)>=f&&ymd(s.date)<=to);const E=DB.expenses.filter(e=>e.cat!=='_income'&&e.cat!=='Supplier payment'&&e.date>=f&&e.date<=to);
    const rev=S.reduce((a,s)=>a+saleNet(s),0),cogs=S.reduce((a,s)=>a+saleCost(s),0),exp=E.reduce((a,e)=>a+e.amount,0),gp=rev-cogs;
    const byPay={};S.forEach(s=>byPay[s.pay]=(byPay[s.pay]||0)+saleNet(s));
    const byCat={};S.forEach(s=>s.items.forEach(i=>{const m=medById(i.medId);const c=m?m.cat:'Other';byCat[c]=(byCat[c]||0)+i.qty*i.price}));
    const byUser={};S.forEach(s=>{const u=userById(s.user)?.name||'?';byUser[u]=(byUser[u]||0)+saleNet(s)});
    const prod={};S.forEach(s=>s.items.forEach(i=>{const p=prod[i.medId]=prod[i.medId]||{q:0,r:0,p:0};p.q+=i.qty;p.r+=i.qty*i.price;p.p+=i.qty*(i.price-i.cost)}));
    const tp=Object.entries(prod).sort((a,b)=>b[1].r-a[1].r).slice(0,10);
    const days=[];for(let d=new Date(f+'T00:00:00');ymd(d)<=to&&days.length<31;d=addDays(1,d))days.push(ymd(d));
    const dv=days.map(d=>S.filter(s=>ymd(s.date)===d).reduce((a,s)=>a+saleNet(s),0));
    const stockVal=DB.meds.reduce((a,m)=>a+stockAll(m)*m.cost,0),stockSell=DB.meds.reduce((a,m)=>a+stockAll(m)*m.price,0);
    $('#rbody').innerHTML=`<div class="grid g4" style="margin-bottom:18px">${kpi('wallet',t('Net revenue','صافي الإيراد'),money(rev),'#0f9d7a',S.length+' '+t('invoices','فاتورة'))}${kpi('tag',t('Cost of goods','تكلفة البضاعة'),money(cogs),'#f59e0b')}${kpi('chart',t('Gross profit','مجمل الربح'),money(gp),'#6c5ce7',rev?Math.round(gp/rev*100)+'%':'')}${kpi('shield',t('Net profit','صافي الربح'),money(gp-exp),gp-exp>=0?'#16a34a':'#e5484d',t('after expenses','بعد المصروفات')+' '+money(exp))}</div>
    <div class="grid g2" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))">
     <div class="card" style="grid-column:1/-1"><h3>${ic('chart')} ${t('Daily sales','المبيعات اليومية')}</h3>${barChart(dv,days.map(d=>d.slice(8)))}</div>
     <div class="card"><h3>${t('By payment method','حسب طريقة الدفع')}</h3>${donut(Object.entries(byPay).map(([k,v],i)=>({l:k,v,c:CCOL[i]})))}</div>
     <div class="card"><h3>${t('By category','حسب القسم')}</h3>${donut(Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>({l:catName(k),v,c:catCol(k)})))}</div>
     <div class="card"><h3>${t('Top products','الأصناف الأعلى')}</h3>${tableWrap([t('Item','الصنف'),t('Qty','الكمية'),t('Revenue','الإيراد'),t('Profit','الربح')],tp.map(([id,p])=>`<tr><td>${esc(mname(medById(id)||{en:'?'}))}</td><td>${p.q}</td><td>${money(p.r)}</td><td>${money(p.p)}</td></tr>`))}</div>
     <div class="card"><h3>${t('Cashier performance','أداء الكاشير')}</h3>${Object.entries(byUser).map(([u,v])=>`<div class="list-i"><b class="sp">${esc(u)}</b><b>${money(v)}</b></div>`).join('')||'—'}<h3 style="margin-top:20px">${ic('box')} ${t('Inventory valuation','تقييم المخزون')}</h3><div class="list-i"><span class="sp">${t('At cost','بالتكلفة')}</span><b>${money(stockVal)}</b></div><div class="list-i"><span class="sp">${t('At selling price','بسعر البيع')}</span><b>${money(stockSell)}</b></div><div class="list-i"><span class="sp">${t('Expected margin','هامش متوقع')}</span><b>${money(stockSell-stockVal)}</b></div></div>
    </div>`;
    $('#rexp').onclick=()=>csv('report',[['Invoice','Date','Net','Cost','Profit','Payment'],...S.map(s=>[s.no,s.date,saleNet(s),saleCost(s),saleNet(s)-saleCost(s),s.pay])]);
  };
  $('[name=rf]',el).onchange=e=>{filt.rf=e.target.value;draw()};$('[name=rt]',el).onchange=e=>{filt.rt=e.target.value;draw()};draw();
};

/* ---- Users ---- */
V.users=el=>{
  el.innerHTML=`<div class="bar"><span class="sp"></span><button class="btn p" onclick="userForm()">${ic('plus')} ${t('Add user','إضافة مستخدم')}</button></div>`+tableWrap([t('Name','الاسم'),t('Role','الصلاحية'),''],DB.users.map(u=>`<tr><td><b>${esc(u.name)}</b></td><td><span class="badge acc">${roleName(u.role)}</span></td><td class="nowrap"><button class="btn sm" onclick="userForm('${u.id}')">${ic('edit')}</button> ${u.id!==ME.id?`<button class="btn sm" onclick="DB.users=DB.users.filter(x=>x.id!=='${u.id}');persist();render()">${ic('trash')}</button>`:''}</td></tr>`));
};
function userForm(id){const u=id?userById(id):{name:'',role:'cashier',pin:''};
  modal(id?t('Edit user','تعديل مستخدم'):t('New user','مستخدم جديد'),`<div class="fg">${field(t('Name','الاسم'),'name',u.name)}${sel(t('Role','الصلاحية'),'role',[['admin',roleName('admin')],['pharmacist',roleName('pharmacist')],['cashier',roleName('cashier')]],u.role)}${field(t('PIN (4+ digits)','الرقم السري (٤ أرقام+)'),'pin',u.pin,'text','inputmode="numeric"')}</div>`,{onOk:o=>{if(!fv(o,'name').trim()||fv(o,'pin').length<4){toast(t('Name & 4+ digit PIN required','الاسم ورقم سري ٤ أرقام على الأقل'),'bad');return false}
    const d={name:fv(o,'name'),role:fv(o,'role'),pin:fv(o,'pin')};if(id)Object.assign(u,d);else DB.users.push({id:uid(),...d});persist();render()}})}

/* ---- Settings ---- */
V.settings=el=>{
  const s=DB.settings;
  el.innerHTML=`<div class="grid g2" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr))"><div class="card"><h3>${ic('pill')} ${t('Pharmacy profile','بيانات الصيدلية')}</h3><div class="fg">${field(t('Name (Arabic)','الاسم (عربي)'),'name',s.name)}${field(t('Name (English)','الاسم (إنجليزي)'),'nameEn',s.nameEn)}${field(t('Phone','الهاتف'),'phone',s.phone)}${field(t('License no.','رقم الترخيص'),'license',s.license)}<div class="full">${field(t('Address','العنوان'),'address',s.address)}</div><div class="full">${field(t('Receipt footer','تذييل الفاتورة'),'footer',s.footer)}</div></div></div>
  <div class="card"><h3>${ic('cog')} ${t('System','النظام')}</h3><div class="fg">${field(t('Currency','العملة'),'currency',s.currency)}${field(t('Tax %','الضريبة %'),'tax',s.tax,'number','min="0" step="0.1"')}${field(t('Expiry alert (days)','تنبيه الصلاحية (أيام)'),'expDays',s.expDays,'number','min="1"')}</div>
   <button class="btn p" style="margin-top:16px" id="ssave">${ic('check')} ${t('Save settings','حفظ الإعدادات')}</button>
   <h3 style="margin-top:28px">${ic('shield')} ${t('Backup & data','النسخ الاحتياطي والبيانات')}</h3><div class="row" style="flex-wrap:wrap"><button class="btn" id="bk">${ic('down')} ${t('Export backup','تصدير نسخة')}</button><label class="btn" style="cursor:pointer">${ic('up')} ${t('Import','استيراد')}<input type="file" id="bi" accept=".json" hidden></label><button class="btn d" id="rs">${t('Reset demo data','إعادة بيانات تجريبية')}</button></div>
   <p class="muted" style="margin-top:10px;font-size:13px">${t('Data is stored locally in this browser. Export regular backups.','البيانات محفوظة محلياً في هذا المتصفح. صدّر نسخة احتياطية بانتظام.')}</p></div></div>`;
  $('#ssave').onclick=()=>{['name','nameEn','phone','license','address','footer','currency'].forEach(k=>s[k]=$(`[name=${k}]`,el).value);s.tax=+$('[name=tax]',el).value||0;s.expDays=+$('[name=expDays]',el).value||90;persist();toast(t('Saved','تم الحفظ'));render()};
  $('#bk').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(DB)],{type:'application/json'}));a.download='roshetta-backup-'+today()+'.json';a.click()};
  $('#bi').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.meds||!d.settings)throw 0;DB=d;persist();applyLang();ME=DB.users.find(u=>u.id===ME.id)||DB.users[0];render();toast(t('Imported','تم الاستيراد'))}catch(x){toast(t('Invalid file','ملف غير صالح'),'bad')}};r.readAsText(f)};
  $('#rs').onclick=()=>confirmD(t('Replace all data with demo data?','استبدال كل البيانات ببيانات تجريبية؟'),()=>{const l=DB.settings.lang,th=DB.settings.theme;DB=seed();DB.settings.lang=l;DB.settings.theme=th;persist();ME=DB.users[0];render()});
};

/* ---------- boot ---------- */
document.addEventListener('keydown',e=>{
  if(!ME)return;
  if(e.key==='F2'&&VIEW==='pos'){e.preventDefault();$('#pq')?.focus()}
  if(e.key==='F9'&&VIEW==='pos'){e.preventDefault();checkout()}
  if(e.key==='Escape')$$('.ov').pop()?.remove();
});
function boot(){$('#login').hidden=true;$('#app').hidden=false;const h=location.hash.slice(1);if(h&&NAV.find(n=>n[0]===h&&n[3].includes(ME.role)))VIEW=h;else VIEW='dashboard';render()}
load();applyLang();
const su=sessionStorage.getItem('rs_u');ME=su?DB.users.find(u=>u.id===su):null;
ME?boot():showLogin();
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(ME&&h&&h!==VIEW&&V[h]){VIEW=h;render()}});
</script>
</body>
</html>
